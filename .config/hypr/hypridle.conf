# Keep the computer running for SSH and background work.
# Only lock the local session and power down the displays when idle.

general {
    lock_cmd = pidof hyprlock || hyprlock --config ~/.config/hypr/hyprlock.conf --grace 0 --immediate-render
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock the local desktop after 5 minutes.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Put both monitors into low-power standby after 10 minutes.
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
