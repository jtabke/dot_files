# Catppuccin Mocha lock screen.
# Authentication uses the system PAM configuration for hyprlock.

$font = Hack Nerd Font
$base = rgb(1e1e2e)
$text = rgb(cdd6f4)
$subtext = rgb(a6adc8)
$surface = rgb(313244)
$mauve = rgb(cba6f7)
$red = rgb(f38ba8)
$green = rgb(a6e3a1)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 3
    blur_size = 7
}

label {
    monitor =
    text = $TIME
    color = $text
    font_size = 82
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = $subtext
    font_size = 22
    font_family = $font
    position = 0, 55
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = $mauve
    inner_color = $surface
    font_color = $text
    check_color = $green
    fail_color = $red
    placeholder_text = <span foreground="##a6adc8">Password…</span>
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    rounding = 14
    font_family = $font
    position = 0, -40
    halign = center
    valign = center
}
