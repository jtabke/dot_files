# General Settings
set -g mouse on  # Enable mouse support (tmux 2.1+)
set -g allow-passthrough on  # Allow escape sequences for notifications/progress bars
set -g escape-time 0  # No delay after pressing Escape
set -g history-limit 50000  # Scrollback buffer size
set -g base-index 1  # Start window numbering at 1
setw -g pane-base-index 1  # Start pane numbering at 1
set -g renumber-windows on  # Renumber windows when one is closed
set -g focus-events on  # Enable focus events for vim/neovim autoread

# Remote tmux focus mode: Ctrl-g zooms the current SSH pane, hides the local
# status bar, and sends the normal Ctrl-b prefix directly to the remote tmux.
bind-key -n C-g if-shell -F '#{==:#{@remote_focus},1}' \
  'set-option prefix C-b; set-option status on; set-option -u @remote_focus; resize-pane -Z' \
  'resize-pane -Z; set-option prefix None; set-option status off; set-option @remote_focus 1'

# Pane Splitting
bind | split-window -h -c '#{pane_current_path}'  # Vertical split with |
bind - split-window -v -c '#{pane_current_path}'  # Horizontal split with -
unbind '"'  # Remove default split bindings
unbind %

# Pane Navigation (vim-like)
bind -r h select-pane -L  # Left
bind -r j select-pane -D  # Down
bind -r k select-pane -U  # Up
bind -r l select-pane -R  # Right

bind-key < swap-window -d -t -1  # Move left and keep focus
bind-key > swap-window -d -t +1  # Move right and keep focus

# Reload with prefix+r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Unbind Default Navigation Keys
# unbind Up
# unbind Down
# unbind Left
# unbind Right
# unbind C-Up
# unbind C-Down
# unbind C-Left
# unbind C-Right

# Balanced, compact status bar
set -g status on
set -g status-position top
set -g status-style 'bg=colour235,fg=colour245'
# Keep the window list physically centered as left/right content changes.
set -g status-justify absolute-centre
set -g status-left-length 40
set -g status-right-length 50
set -g status-interval 5

# Messages
set -g message-style 'fg=colour222,bg=colour238'
set -g message-command-style 'fg=colour222,bg=colour238'

# Keep panes clean; show pane numbers on demand with prefix+q.
set -g window-style 'fg=colour247'
set -g window-active-style 'fg=terminal'
set -g pane-border-status off
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style "#{?pane_in_mode,fg=yellow,#{?synchronize-panes,fg=red,fg=colour154}}"
set -g pane-border-indicators arrows

# Host and session identify the tmux layer without decorative separators.
set -g status-left '#[bold,fg=colour154] #H #[nobold,fg=colour240]· #[fg=colour250]#S  '

# Indicators grow leftward only when active; the clock stays right-aligned.
set -g status-right '#[bold,fg=yellow]#{?client_prefix,PREFIX ,}#{?pane_in_mode,COPY ,}#[fg=red]#{?synchronize-panes,SYNC ,}#[fg=colour81]#{?window_zoomed_flag,ZOOM ,}#[nobold,fg=colour245]%H:%M '

# Flat window list; highlight only the current window.
setw -g window-status-separator ' '
setw -g window-status-style 'fg=colour244,bg=colour235,none'
setw -g window-status-activity-style 'fg=colour154,bg=colour235,bold'
setw -g window-status-format '#[fg=colour244,bg=colour235] #I:#W '
setw -g window-status-current-format '#[bold,fg=colour232,bg=colour154] #I:#W #[default]'
