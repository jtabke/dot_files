# Fuzzel launcher — Catppuccin Mocha to match Waybar + Hyprland (rounding 8)
# See: man 5 fuzzel.ini

[main]
font = Hack Nerd Font:size=11
# ghostty is your terminal (hyprland.lua), $TERMINAL is kitty — set explicitly
terminal = ghostty -e
prompt = "󰀻  "
placeholder = "Search applications…"
icon-theme = Adwaita
icons-enabled = yes
# one row per app (actions on Mod+Shift+A) — filename excluded so
# typing "desktop" doesn't match everything
fields = name,generic,comment,keywords
match-mode = fzf
sort-result = yes
show-actions = no
filter-desktop = yes
match-counter = yes
lines = 12
width = 55
horizontal-pad = 20
vertical-pad = 12
inner-pad = 8
layer = overlay
exit-on-keyboard-focus-loss = yes
# keep MRU ordering, remember frequent apps in ~/.cache/fuzzel

[colors]
background = 1e1e2ee6
text = cdd6f4ff
prompt = cba6f7ff
placeholder = 6c7086ff
input = cdd6f4ff
match = 89dcebff
selection = 45475aff
selection-text = cdd6f4ff
selection-match = 89dcebff
counter = 7f849cff
border = 33ccffee

[border]
width = 2
radius = 8
